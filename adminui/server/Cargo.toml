[package]
name = "adminui"
version = "0.1.0"
edition = "2021"
description = "On-device admin web UI for the ZTE F670L"
license = "MIT"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "multipart"] }
tokio = { version = "1", features = ["rt", "net", "process", "time", "sync", "macros", "fs", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rust-embed = { version = "8", features = ["include-exclude"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
getrandom = "0.2"
regex-lite = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
